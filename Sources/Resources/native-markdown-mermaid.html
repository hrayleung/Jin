<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  color: light-dark(#1d1d1f, #f5f5f7);
  padding: 8px 12px;
}
#root svg { max-width: 100%; height: auto; }
#root .error {
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 12px;
  color: #b00020;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<div id="root"></div>
<script src="markdown-mermaid-runtime.js"></script>
<script>
(function() {
  const root = document.getElementById('root');
  let lastReportedHeight = -1;
  let renderCounter = 0;

  function reportHeight() {
    const h = Math.ceil(document.documentElement.scrollHeight);
    if (h !== lastReportedHeight) {
      lastReportedHeight = h;
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.heightChanged) {
        window.webkit.messageHandlers.heightChanged.postMessage(h);
      }
    }
  }

  function currentTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default';
  }

  function initIfNeeded() {
    if (!window.mermaid) return false;
    if (!window.__jinMermaidInit) {
      window.mermaid.initialize({ startOnLoad: false, theme: currentTheme(), securityLevel: 'strict' });
      window.__jinMermaidInit = true;
    }
    return true;
  }

  function setErrorText(message) {
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error';
    errorDiv.textContent = String(message);
    root.replaceChildren(errorDiv);
  }

  window.renderMermaid = async function(source) {
    if (!initIfNeeded()) {
      setErrorText('Mermaid runtime not loaded');
      reportHeight();
      return;
    }
    const token = ++renderCounter;
    const id = 'jin-mermaid-' + token;
    try {
      const { svg } = await window.mermaid.render(id, source || '');
      if (token !== renderCounter) return;
      root.innerHTML = svg;
    } catch (err) {
      if (token !== renderCounter) return;
      setErrorText((err && err.message) || err);
    }
    requestAnimationFrame(reportHeight);
  };

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    window.__jinMermaidInit = false;
    initIfNeeded();
  });

  window.addEventListener('resize', reportHeight);
  reportHeight();
})();
</script>
</body>
</html>
